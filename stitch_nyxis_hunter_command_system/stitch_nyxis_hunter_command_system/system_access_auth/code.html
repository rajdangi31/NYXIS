<script>
        // Typing effect for the status terminal
        const statusLines = [
            "Establishing secure handshake...",
            "Decrypting authentication layer...",
            "Awaiting identity validation...",
            "System ready. Enter credentials."
        ];
        
        const terminalText = document.getElementById('terminal-text');
        let currentLine = 0;

        function cycleStatus() {
            if (currentLine < statusLines.length) {
                terminalText.innerText = statusLines[currentLine];
                currentLine++;
                setTimeout(cycleStatus, 800);
            }
        }

        setTimeout(cycleStatus, 500);

        // Simple button interaction
        const form = document.getElementById('auth-form');
        const btn = document.getElementById('calibrate-btn');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            btn.innerHTML = `
                <span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span>
                SYNCHRONIZING...
            `;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            terminalText.innerText = "Validation in progress. Please wait.";
            terminalText.classList.add('text-secondary-container');

            // Simulate transition to next screen
            setTimeout(() => {
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 1s ease-in-out';
            }, 1500);
        });

        // Focus Handshake
        const input = document.getElementById('identifier');
        input.addEventListener('focus', () => {
            terminalText.innerText = "Input focus detected. Awaiting data.";
        });
        input.addEventListener('blur', () => {
            if(!input.value) terminalText.innerText = "System ready. Enter credentials.";
        });
    </script>
